[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "cwatm",
    "cwatm.coupling",
    "cwatm.management_modules",
    "cwatm.hydrological_modules",
]

[tool.setuptools.package-dir]
cwatm = "."

[project]
name = "cwatm"
version = "0.1.0"